name: Full Stack CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test All Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build all images
        run: docker compose build

      - name: Start all containers
        run: docker compose up -d

      - name: Wait for Postgres to be healthy
        run: |
          echo "Waiting for postgres..."
          for i in {1..10}; do
            if docker compose exec -T postgres pg_isready -U comms -d comms; then
              echo "Postgres is ready!"
              break
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done

      - name: Wait for MongoDB to accept connections
        run: |
          echo "Waiting for MongoDB..."
          ready=0
          for i in {1..15}; do
            if docker compose exec -T mongo mongosh --quiet --eval "db.adminCommand('ping')" > /dev/null 2>&1; then
              echo "MongoDB is ready!"
              ready=1
              break
            fi
            echo "Attempt $i failed, retrying..."
            sleep 3
          done
          if [ "$ready" != 1 ]; then
            echo "MongoDB did not become ready in time"
            exit 1
          fi

      - name: Wait for Elasticsearch cluster ready
        run: |
          echo "Waiting for Elasticsearch..."
          ready=0
          for i in {1..30}; do
            if curl -sf http://localhost:9200/_cluster/health | grep -qE '"status":"(green|yellow)"'; then
              echo "Elasticsearch is ready!"
              ready=1
              break
            fi
            echo "Attempt $i failed, retrying..."
            sleep 3
          done
          if [ "$ready" != 1 ]; then
            echo "Elasticsearch did not become ready in time"
            exit 1
          fi

      - name: Wait for backend
        run: |
          echo "Waiting for backend..."
          for i in {1..10}; do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Backend is up!"
              break
            fi
            sleep 5
          done

      - name: Wait for frontend
        run: |
          echo "Waiting for frontend..."
          for i in {1..10}; do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "Frontend is up!"
              break
            fi
            sleep 5
          done

      - name: Health checks
        run: |
          curl -f http://localhost:3000 || exit 1
          curl -f http://localhost:8000/health || exit 1

      - name: Tear down
        if: always()
        run: docker compose down

  deploy:
    name: Deploy to Production
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy all services
        run: |
          echo "Deploying all services to production..."
          # Future: Update with actual production deployment steps