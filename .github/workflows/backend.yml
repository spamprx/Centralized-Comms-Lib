name: Backend CI/CD

on:
  push:
    branches:
      - Backend
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'infra/docker/api/**'
      - 'packages/database/mongo/**'
      - 'packages/database/elasticsearch/**'
      - 'docker-compose.yml'

jobs:
  build-and-test:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    env:
      REMOTE_URL: ${{ secrets.REMOTE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Postgres, MongoDB, and Elasticsearch
        run: docker compose up -d postgres mongo elasticsearch

      - name: Wait for Postgres to be healthy
        run: |
          echo "Waiting for postgres..."
          for i in {1..10}; do
            if docker compose exec -T postgres pg_isready -U comms -d comms; then
              echo "Postgres is ready!"
              break
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done

      - name: Wait for MongoDB to accept connections
        run: |
          echo "Waiting for MongoDB..."
          ready=0
          for i in {1..15}; do
            if docker compose exec -T mongo mongosh --quiet --eval "db.adminCommand('ping')" > /dev/null 2>&1; then
              echo "MongoDB is ready!"
              ready=1
              break
            fi
            echo "Attempt $i failed, retrying..."
            sleep 3
          done
          if [ "$ready" != 1 ]; then
            echo "MongoDB did not become ready in time"
            exit 1
          fi

      - name: Wait for Elasticsearch cluster ready
        run: |
          echo "Waiting for Elasticsearch..."
          ready=0
          for i in {1..30}; do
            if curl -sf http://localhost:9200/_cluster/health | grep -qE '"status":"(green|yellow)"'; then
              echo "Elasticsearch is ready!"
              ready=1
              break
            fi
            echo "Attempt $i failed, retrying..."
            sleep 3
          done
          if [ "$ready" != 1 ]; then
            echo "Elasticsearch did not become ready in time"
            exit 1
          fi

      - name: Build backend image
        run: docker compose build backend

      - name: Start backend container
        run: docker compose up -d backend

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend..."
          for i in {1..10}; do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Backend is up!"
              break
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done

      - name: Health check
        run: curl -f http://localhost:8000/health || exit 1

      - name: Tear down
        if: always()
        run: docker compose down

  approve:
    name: Manual Approval
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Approved
        run: echo "Backend approved, ready to merge to main"