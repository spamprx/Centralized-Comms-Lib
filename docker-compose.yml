# Local development: frontend, API backend, and PostgreSQL.
# Usage: docker compose up -d
#   - Postgres: localhost:5432
#   - API:      http://localhost:8000
#   - Frontend: http://localhost:3000
# Optional: copy apps/api/env.example to apps/api/.env and add to backend env_file for overrides.

services:
  postgres:
    image: postgres:16-alpine
    container_name: comms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: comms
      POSTGRES_PASSWORD: comms-dev
      POSTGRES_DB: comms
    ports:
      - "5432:5432"
    volumes:
      - comms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U comms -d comms" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
    container_name: comms-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "8000"
      DATABASE_URL: postgresql://comms:comms-dev@postgres:5432/comms
      REMOTE_URL: ${REMOTE_URL}
      RUN_DB_PUSH: "true"
      RUN_DB_SEED: "true"
      PRISMA_SCHEMA_PATH: packages/database/transactional/prisma/schema.prisma
      JWT_SECRET: your-super-secret-key-change-in-production
      JWT_ISSUER: your-app-name
      JWT_AUDIENCE: your-app-client
      REDIS_URL: redis://localhost:6379
      AI_DAILY_QUOTA: "50"
      AI_QUOTA_WINDOW_MS: "86400000"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
    container_name: comms-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  comms_pgdata:
